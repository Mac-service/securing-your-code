# This is an opt-in example. Enable the repository variable below only after
# Dependency graph and the required security features are available.
name: Dependency review example

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    if: vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a6993e2c61fd5dc440b409aa1d6904921c5e1894 # v4.3.5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
